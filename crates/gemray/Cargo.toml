[package]
name = "gemray"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
description = "A physically-based spectral gemstone renderer that turns GemCAD-style cutting schedules into rendered output."
license = { workspace = true }
repository = { workspace = true }
keywords = ["gemstone", "raytracer", "spectral", "rendering", "faceting"]
categories = ["rendering", "graphics", "science"]
publish = { workspace = true }

[dependencies]
bytemuck = { workspace = true }
chull = { workspace = true }
glam = { workspace = true }
# Only pulled in behind the `hdr` feature (Radiance .hdr decoding for
# `renderer::env_map`). `default-features = false` plus the single `hdr`
# format feature keeps this lean -- the default `image` feature set drags in
# png/gif/webp/avif/exr/etc. decoders gemray has no use for.
image = { workspace = true, optional = true, features = ["hdr"] }
# For `geometry::cuts::StandardGemCuts::from_asc_schedule`, which turns a parsed
# GemCAD `.asc` cutting schedule (lapidary::asc::AscSchedule) into real,
# non-fabricated facet planes. Zero-dependency format crate -- adds nothing to
# gemray's own dependency tree beyond itself.
lapidary = { workspace = true }
pollster = { workspace = true, optional = true }
# Only pulled in behind the `serde` feature, for `gemray-net`'s wire protocol (which
# needs `Serialize`/`Deserialize` on `GemMaterial`, `GpuFacetPlane`, `LightingPreset`
# and their nested types). Off by default so the base `gemray` dependency count (the
# five listed above) stays publishable.
serde = { workspace = true, optional = true }
tracing = { workspace = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
# Used only by examples/meet_solver_validation.rs, which validates
# geometry::meet_solver against a real design corpus by reading a
# facet_diagrams.sqlite catalogue directly. A dev-dependency, so it never reaches a
# built binary -- see that example's own doc comment for why that validation cannot
# live in this crate's test suite instead.
rusqlite = { workspace = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]
# Loads Radiance `.hdr` equirectangular environment maps for
# `renderer::env_map::EnvironmentMap`. Off by default so the base `gemray`
# dependency count (the four listed above) stays publishable; the CPU-side
# importance-sampling machinery in `env_map` itself needs no extra
# dependency and is always available.
hdr = ["dep:image"]
# Derives `Serialize`/`Deserialize` for the scene-description types `gemray-net` sends
# over the wire to a remote render worker: `GemMaterial` and its nested types
# (`CrystalSystem`, `OpticalCharacter`, `DispersionModel`, `AbsorptionBand`,
# `AbsorptionTensor`), `geometry::GpuFacetPlane`, and `optics::raytracer::LightingPreset`.
# Also turns on glam's own `serde` feature, needed for `GemMaterial::c_axis: Vec3`.
# Off by default -- see the `serde` dependency comment above.
serde = ["dep:serde", "glam/serde"]

[[example]]
name = "gpu_equivalence_harness"
# Needs a real GPU adapter (see the example's own doc comment) -- `cargo check
# --workspace --all-targets` / `cargo test` without `--features gpu` must skip
# building it entirely, not merely skip running it, since `renderer::gpu` (which it
# imports) doesn't exist without the feature either.
required-features = ["gpu"]

[lints]
workspace = true
